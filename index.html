<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CW WebSerial Monitor</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            padding: 20px;
            margin: 0;
        }
        #controls {
            margin-bottom: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #555;
        }
        #monitor {
            width: 100%;
            height: 60vh;
            background-color: #121212;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.5;
        }
        /* 通常の文字（英数字など）のスタイル */
        .normal-text {
            font-size: 18px;
            color: #ffffff;
        }
        /* 倍角（2倍）にしたいカナ文字のスタイル */
        .baikaku-text {
            font-size: 36px; /* 2倍の大きさ */
            font-weight: bold;
            color: #ffcc00; /* カナを視覚的に目立たせるために黄色に */
            display: inline-block;
            transform: scaleX(1); /* 必要に応じて横幅の調整も可能 */
        }
    </style>
</head>
<body>

    <h2>CW WebSerial Monitor</h2>
    
    <div id="controls">
        <button id="connectBtn">デバイスに接続</button>
    </div>

    <!-- ここに打鍵した文字が表示されます -->
    <div id="monitor"></div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const monitor = document.getElementById('monitor');
        let port;

        // WebSerial APIがブラウザに対応しているかチェック
        if (!('serial' in navigator)) {
            alert('お使いのブラウザはWebSerialに対応していません。AndroidのChrome等でお試しください。');
            connectBtn.disabled = true;
        }

        connectBtn.addEventListener('click', async () => {
            try {
                // ユーザーにシリアルポートを選択してもらう
                port = await navigator.serial.requestPort();
                // ボーレートを設定してポートを開く（9600bpsの例、デバイスに合わせて変更してください）
                await port.open({ baudRate: 9600 });
                
                connectBtn.textContent = '接続中...';
                connectBtn.disabled = true;

                // データ受信のループを開始
                readLoop();

            } catch (error) {
                console.error('接続エラー:', error);
                alert('接続に失敗しました。');
            }
        });

        async function readLoop() {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
            const reader = textDecoder.readable.getReader();

            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) {
                        break;
                    }
                    if (value) {
                        // 受信した文字列を1文字ずつ解析して画面に出力
                        parseAndDisplay(value);
                    }
                }
            } catch (error) {
                console.error('受信エラー:', error);
            } finally {
                reader.releaseLock();
            }
        }

        // 文字を判別して画面に追加する関数
        function parseAndDisplay(text) {
            for (let char of text) {
                const span = document.createElement('span');
                
                // 【重要】文字が「カタカナ」かどうかを正規表現で判定
                // 全角カタカナ、半角カタカナ、および長音記号（ー）を対象
                if (char.match(/[\u30a0-\u30ff\uff65-\uff9f]/)) {
                    span.textContent = char;
                    span.className = 'baikaku-text'; // CSSでフォントサイズを2倍に
                } else {
                    span.textContent = char;
                    span.className = 'normal-text'; // 通常サイズ
                }
                
                monitor.appendChild(span);
            }
            // 常に最新の文字が見えるように自動スクロール
            monitor.scrollTop = monitor.scrollHeight;
        }
    </script>
</body>
</html>
